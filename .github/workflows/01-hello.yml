name: 01 - Hello

on:
  push:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-26.04
    steps:
      - name: Hello
        run: echo "Hello World"

      - name: Ver fecha del runner
        run: date

      - name: Ver archivos disponibles
        run: ls -la

  repo-files:
    runs-on: ubuntu-26.04
    steps:
      - name: "Descargar codigo del repo"
        uses: actions/checkout@v6

      - name: "Ver archivos disponibles"
        run: ls -la

      - name: "Quien soy"
        run: whoami
